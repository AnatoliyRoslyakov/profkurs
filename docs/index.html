<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f6f1">
  <title>Профкурс — выбор профессии</title>
  <link rel="stylesheet" href="./style.css?v=4">
  <script src="./config.js" defer></script>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <script type="module" src="./app.js?v=4"></script>
</head>
<body>
  <header class="masthead">
    <div class="mast-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Профкурс</div>
      <button class="theme-button" id="theme" type="button" aria-label="Включить тёмную тему" title="Включить тёмную тему"><span class="theme-icon" aria-hidden="true"></span></button>
    </div>
  </header>
  <main class="layout">
    <div class="journey">
      <div class="journey-status" role="status"><span id="stage-count"></span><strong id="stage-name"></strong></div>
      <nav class="progress-strip" id="stations" aria-label="Этапы анкеты"></nav>
    </div>
    <section class="question-panel" id="panel" aria-labelledby="question">
      <noscript>Включите JavaScript, чтобы пройти анкету и подобрать профессию.</noscript>
    </section>
  </main>
</body>
</html>
